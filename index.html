<html lang="zh-TW">

<title>韓文 10 週密集計畫</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600&family=Noto+Sans+TC:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#1c2e2a;--paper:#eef4f2;--cream:#e0ece8;--accent:#2a7a6a;--gold:#1a6080;--muted:#5a7a72;--line:#b8d4cc;--success:#1a8060;--highlight:#d0ece4;--blue:#1a5a80;--header:#163028;--rainbow:linear-gradient(90deg,#e07060,#e09040,#80b060,#2a9a80,#2070b0,#7060c0)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh}
header{background:var(--header);color:var(--paper);padding:1.8rem 2rem 1.4rem;position:sticky;top:0;z-index:100;display:flex;align-items:flex-end;gap:2rem}
.header-title .kr{font-family:'Noto Serif KR',serif;font-size:1.6rem;font-weight:300;letter-spacing:.1em}
.header-title .sub{font-size:.7rem;color:#8ab8b0;letter-spacing:.15em;text-transform:uppercase;margin-top:.2rem}
.header-badge{background:var(--accent);color:#f0ece4;font-size:.65rem;letter-spacing:.12em;padding:.3rem .7rem;border-radius:2px;font-family:'DM Mono',monospace}
.progress-bar-wrap{flex:1;max-width:280px}
.progress-label{font-size:.68rem;color:#8ab8b0;letter-spacing:.1em;margin-bottom:.4rem;display:flex;justify-content:space-between}
.progress-bar{height:3px;background:#1a5048;border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .4s ease}
.layout{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 76px)}
aside{background:var(--cream);border-right:1px solid var(--line);padding:1.2rem 0;overflow-y:auto;max-height:calc(100vh - 76px);position:sticky;top:76px}
.phase-label{font-size:.62rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);padding:.9rem 1.2rem .3rem;font-weight:500}
.week-btn{width:100%;text-align:left;background:none;border:none;padding:.6rem 1.2rem;cursor:pointer;display:flex;align-items:flex-start;gap:.7rem;font-family:'Noto Sans TC',sans-serif;font-size:.8rem;color:var(--ink);transition:background .15s}
.week-btn:hover{background:rgba(0,0,0,.05)}
.week-btn.active{background:var(--header);color:var(--paper)}
.week-btn.active .wnum{background:var(--accent);color:var(--paper)}
.week-btn.completed .wnum{background:var(--success);color:#f0ece4}
.week-btn.rainbow-week .wnum{background:var(--rainbow);color:#f0ece4}
.wnum{font-family:'DM Mono',monospace;font-size:.68rem;background:var(--line);min-width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.wtopic{flex:1;line-height:1.35}
.wkr{font-family:'Noto Serif KR',serif;font-size:.72rem;color:var(--muted);display:block;margin-top:1px}
.week-btn.active .wkr{color:#7abcb0}
main{padding:2.2rem 2.8rem;max-width:840px}
.week-panel{display:none;animation:fadeIn .3s ease}
.week-panel.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.week-header{display:flex;align-items:flex-start;gap:1rem;margin-bottom:1.8rem;padding-bottom:1rem;border-bottom:2px solid var(--accent)}
.week-num-big{font-family:'DM Mono',monospace;font-size:.75rem;color:var(--muted);letter-spacing:.1em;padding-top:.3rem}
.week-titles{flex:1}
.week-title-big{font-family:'Noto Serif KR',serif;font-size:1.5rem;font-weight:300;line-height:1.3}
.week-subtitle{font-size:.75rem;color:var(--muted);margin-top:.3rem;letter-spacing:.05em}
.rainbow-banner{background:var(--rainbow);padding:2px;border-radius:4px;margin-bottom:1.5rem}
.rainbow-inner{background:var(--header);color:var(--paper);padding:.7rem 1.2rem;border-radius:3px;font-size:.8rem;line-height:1.6}
.rainbow-inner strong{color:#a0e8d8}
.complete-btn{font-family:'Noto Sans TC',sans-serif;font-size:.72rem;padding:.38rem .9rem;border:1.5px solid var(--accent);background:none;cursor:pointer;border-radius:2px;white-space:nowrap;transition:all .2s;margin-top:.2rem;color:var(--ink)}
.complete-btn:hover{background:var(--accent);color:var(--paper)}
.complete-btn.done{background:var(--success);border-color:var(--success);color:var(--paper)}
.topic-tabs{display:flex;gap:0;margin-bottom:1.5rem;border-bottom:1px solid var(--line)}
.topic-tab{padding:.55rem 1.2rem;font-size:.78rem;cursor:pointer;border:none;background:none;font-family:'Noto Sans TC',sans-serif;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .2s}
.topic-tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}
.topic-panel{display:none}
.topic-panel.active{display:block}
.section{margin-bottom:1.8rem}
.section-title{font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:.9rem;font-weight:500;display:flex;align-items:center;gap:.5rem}
.section-title::after{content:'';flex:1;height:1px;background:var(--line)}
.vocab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:.55rem}
.vocab-card{background:#eef6f2;border:1px solid var(--line);padding:.75rem .9rem;border-radius:4px;cursor:pointer;transition:all .2s}
.vocab-card:hover{border-color:var(--accent)}
.vocab-card .kr-word{font-family:'Noto Serif KR',serif;font-size:1.1rem;display:block}
.vocab-card .romanization{font-family:'DM Mono',monospace;font-size:.68rem;color:var(--muted);display:block;margin-top:.1rem}
.vocab-card .meaning{font-size:.78rem;margin-top:.45rem;display:none;border-top:1px solid var(--line);padding-top:.45rem}
.vocab-card.revealed .meaning{display:block}
.vocab-card.revealed{background:var(--highlight)}
.grammar-box{background:#f4faf8;border-left:3px solid var(--accent);padding:1.1rem 1.4rem;margin-bottom:.9rem;border-radius:0 4px 4px 0}
.grammar-pattern{font-family:'Noto Serif KR',serif;font-size:1.05rem;color:var(--accent);margin-bottom:.4rem}
.grammar-explain{font-size:.82rem;color:var(--muted);margin-bottom:.7rem;line-height:1.7}
.grammar-example{font-size:.88rem;line-height:1.9}
.grammar-example .kr{font-family:'Noto Serif KR',serif}
.grammar-example .zh{color:var(--muted);font-size:.8rem}
.dialogue{display:flex;flex-direction:column;gap:.75rem}
.dialogue-line{display:flex;gap:.9rem;align-items:flex-start}
.speaker{font-family:'DM Mono',monospace;font-size:.62rem;background:var(--accent);color:var(--paper);padding:.18rem .45rem;border-radius:2px;white-space:nowrap;margin-top:.2rem}
.speaker.b{background:var(--blue)}
.speaker.c{background:var(--success)}
.dialogue-text .kr{font-family:'Noto Serif KR',serif;font-size:.95rem;display:block}
.dialogue-text .zh{font-size:.76rem;color:var(--muted)}
.quiz-wrap{display:flex;flex-direction:column;gap:1rem}
.quiz-item{background:#eef6f2;border:1px solid var(--line);padding:1.1rem 1.4rem;border-radius:4px}
.quiz-q{font-size:.9rem;margin-bottom:.9rem;line-height:1.6}
.quiz-q .kr{font-family:'Noto Serif KR',serif;font-size:1.05rem}
.quiz-options{display:flex;flex-direction:column;gap:.45rem}
.quiz-opt{background:var(--cream);border:1.5px solid transparent;padding:.55rem .9rem;border-radius:3px;cursor:pointer;font-size:.82rem;transition:all .15s;text-align:left;font-family:'Noto Sans TC',sans-serif}
.quiz-opt:hover:not(:disabled){border-color:var(--gold)}
.quiz-opt.correct{background:#c8e8e0;border-color:var(--success);color:#1a6050}
.quiz-opt.wrong{background:#d8e8f0;border-color:#5080a0;color:#204060}
.tip-box{background:#d8eee8;border:1px solid #a0ccbc;border-radius:4px;padding:.9rem 1.1rem;font-size:.8rem;line-height:1.7;margin-bottom:1.2rem}
.tip-box strong{color:var(--gold)}
.week-nav{display:flex;justify-content:space-between;margin-top:2.5rem;padding-top:1.2rem;border-top:1px solid var(--line)}
.nav-btn{font-family:'Noto Sans TC',sans-serif;font-size:.78rem;padding:.55rem 1.3rem;background:none;border:1.5px solid var(--accent);color:var(--ink);cursor:pointer;border-radius:2px;display:flex;align-items:center;gap:.4rem;transition:all .2s}
.nav-btn:hover:not(:disabled){background:var(--accent);color:var(--paper)}
.nav-btn:disabled{opacity:.3;cursor:not-allowed}
/* TTS */
.speak-btn{display:inline-flex;align-items:center;justify-content:center;background:none;border:none;cursor:pointer;padding:0 0 0 .35rem;opacity:.4;transition:opacity .2s;vertical-align:middle;flex-shrink:0}
.speak-btn:hover{opacity:1}
.speak-btn svg{width:14px;height:14px;fill:var(--accent)}
.speak-btn.speaking svg{fill:var(--success);animation:pulse .6s ease infinite alternate}
@keyframes pulse{from{opacity:.5}to{opacity:1}}
.vocab-card{background:#eef6f2;border:1px solid var(--line);padding:.75rem .9rem;border-radius:4px;cursor:default;transition:border-color .2s}
.vocab-card:hover{border-color:var(--accent)}
.vocab-card-top{display:flex;align-items:flex-start;justify-content:space-between}
.vocab-card-text{flex:1;cursor:pointer}
.vocab-card .kr-word{font-family:'Noto Serif KR',serif;font-size:1.1rem;display:block}
.vocab-card .romanization{font-family:'DM Mono',monospace;font-size:.68rem;color:var(--muted);display:block;margin-top:.1rem}
.vocab-card .meaning{font-size:.78rem;margin-top:.45rem;display:none;border-top:1px solid var(--line);padding-top:.45rem}
.vocab-card.revealed .meaning{display:block}
.vocab-card.revealed{background:var(--highlight)}
.dialogue-kr-wrap{display:flex;align-items:baseline;gap:.1rem;flex-wrap:wrap}
.tts-notice{font-size:.67rem;color:var(--muted);text-align:right;padding:.3rem 0 0;letter-spacing:.04em}
@media(max-width:680px){.layout{grid-template-columns:1fr}aside{position:static;max-height:none;display:flex;overflow-x:auto;padding:.5rem 0}main{padding:1.4rem 1rem}.phase-label{display:none}.week-btn{flex-direction:column;align-items:center;padding:.5rem .6rem;min-width:72px;font-size:.7rem}}
</style>
</head>
<body>
<header>
  <div class="header-title">
    <div style="display:flex;align-items:center;gap:.7rem;margin-bottom:.3rem">
      <div class="kr">한국어 속성반</div>
      <div class="header-badge">10-WEEK INTENSIVE</div>
    </div>
    <div class="sub">首爾出發前完整準備 · Seoul-Ready in 10 Weeks</div>
  </div>
  <div class="progress-bar-wrap">
    <div class="progress-label"><span>學習進度</span><span id="progress-text">0 / 10 週</span></div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
  </div>
</header>
<div class="layout">
<aside id="sidebar"></aside>
<main id="main-content"></main>
</div>
<script>
const W = [
  {
    id:1, kr:'한글 완성', titles:['韓文字母：母音與子音','終聲（받침）與連音'],
    topics:[
      {
        label:'① 字母系統',
        tip:'建議每天花20分鐘寫字母。激音時手放嘴前應感受氣流，緊音則要緊繃喉嚨。',
        vocab:[
          {kr:'아/이/우/에/오',rom:'a/i/u/e/o',zh:'五個基本母音'},
          {kr:'가나다라마',rom:'ga-na-da-ra-ma',zh:'子音ㄱㄴㄷㄹㅁ＋母音ㅏ'},
          {kr:'激音 ㅋ/ㅌ/ㅍ/ㅊ',rom:'k/t/p/ch',zh:'送氣強的子音'},
          {kr:'緊音 ㄲ/ㄸ/ㅃ/ㅆ/ㅉ',rom:'kk/tt/pp/ss/jj',zh:'緊繃喉嚨的子音'},
          {kr:'한글',rom:'han-geul',zh:'韓文字母系統'},
          {kr:'발음',rom:'ba-reum',zh:'發音'},
        ],
        grammar:[{
          pattern:'韓文音節：초성＋중성＋받침',
          explain:'每個韓文音節是方塊，由「初聲（子音）＋中聲（母音）＋終聲（可省略）」組成。平音、激音、緊音是發音三大類。',
          examples:[
            {kr:'감 = ㄱ＋ㅏ＋ㅁ',zh:'初聲g＋中聲a＋終聲m'},
            {kr:'ㄱ / ㅋ / ㄲ',zh:'平音 / 激音 / 緊音'},
          ]
        }],
        dialogue:[
          {sp:'A',kr:'안녕하세요!',zh:'您好！'},
          {sp:'B',kr:'안녕하세요! 처음 뵙겠습니다.',zh:'您好！初次見面。'},
        ],
        quiz:[
          {q:'下列哪個是母音？',opts:['ㄱ','ㅏ','ㄴ','ㄷ'],ans:1},
          {q:'「ㄷ」的激音是？',opts:['ㄸ','ㅌ','ㄹ','ㅎ'],ans:1},
        ]
      },
      {
        label:'② 終聲連音',
        tip:'連音是韓文最重要的發音規則：終聲遇到空子音ㅇ就往右移。',
        vocab:[
          {kr:'밥',rom:'bap',zh:'飯（終聲ㅂ）'},
          {kr:'물',rom:'mul',zh:'水（終聲ㄹ）'},
          {kr:'책',rom:'chaek',zh:'書（終聲ㄱ）'},
          {kr:'밥이 → [바비]',rom:'ba-bi',zh:'連音後發音'},
          {kr:'학교',rom:'hak-gyo',zh:'學校'},
          {kr:'음악',rom:'eu-mak',zh:'音樂'},
        ],
        grammar:[{
          pattern:'連音法則（연음법칙）',
          explain:'終聲後接ㅇ開頭的音節時，終聲移至下一音節發音。終聲實際只有7種發音：ㄱ ㄴ ㄷ ㄹ ㅁ ㅂ ㅇ。',
          examples:[
            {kr:'밥이 → [바비]',zh:'飯＋主格助詞'},
            {kr:'책이 → [채기]',zh:'書＋主格助詞'},
          ]
        }],
        dialogue:[
          {sp:'A',kr:'밥 먹었어요?',zh:'吃飯了嗎？'},
          {sp:'B',kr:'네, 먹었어요.',zh:'吃了。'},
        ],
        quiz:[
          {q:'「밥이」的實際發音是？',opts:['[밥이]','[바비]','[바피]','[밥피]'],ans:1},
          {q:'終聲共有幾種實際發音？',opts:['19種','14種','7種','21種'],ans:2},
        ]
      }
    ]
  },
  {
    id:2, kr:'숫자와 인사', titles:['數字、日期與時間','打招呼與自我介紹'],
    topics:[
      {
        label:'① 數字日期',
        tip:'記住星期：월화수목금토일，對應月火水木金土日。漢字音用於日期時間；固有語用於數量。',
        vocab:[
          {kr:'일/이/삼/사/오',rom:'il/i/sam/sa/o',zh:'一二三四五（漢字音）'},
          {kr:'하나/둘/셋/넷/다섯',rom:'ha-na/dul/set/net/da-seot',zh:'一二三四五（固有語）'},
          {kr:'오늘',rom:'o-neul',zh:'今天'},
          {kr:'내일',rom:'nae-il',zh:'明天'},
          {kr:'몇 시예요?',rom:'myeot si-ye-yo',zh:'幾點了？'},
          {kr:'7월 8일',rom:'chil-wol pa-il',zh:'7月8日'},
        ],
        grammar:[{
          pattern:'時刻：固有語 시 ＋ 漢字音 분',
          explain:'「幾點幾分」：點（時）用固有語，分用漢字音。',
          examples:[
            {kr:'두 시 삼십 분',zh:'2點30分'},
            {kr:'열두 시',zh:'12點'},
          ]
        }],
        dialogue:[
          {sp:'A',kr:'오늘이 무슨 요일이에요?',zh:'今天是星期幾？'},
          {sp:'B',kr:'오늘은 화요일이에요.',zh:'今天是星期二。'},
        ],
        quiz:[
          {q:'日期「幾號」用哪套數字？',opts:['固有語','漢字音','兩者皆可','英文'],ans:1},
          {q:'「내일」是什麼意思？',opts:['昨天','今天','明天','後天'],ans:2},
        ]
      },
      {
        label:'② 自我介紹',
        tip:'初次見面一律用합니다/해요體敬語。不要用반말，直到對方主動提議。',
        vocab:[
          {kr:'저는',rom:'jeo-neun',zh:'我（謙遜主格）'},
          {kr:'반갑습니다',rom:'ban-gap-seum-ni-da',zh:'很高興認識你'},
          {kr:'직업',rom:'ji-geop',zh:'職業'},
          {kr:'디자이너',rom:'di-ja-i-neo',zh:'設計師'},
          {kr:'어디에서 왔어요?',rom:'eo-di-e-seo wa-sseo-yo',zh:'您從哪裡來？'},
          {kr:'타이완',rom:'ta-i-wan',zh:'台灣'},
        ],
        grammar:[{
          pattern:'저는 ___예요/이에요',
          explain:'自我介紹句。名詞末為母音加「예요」，末為子音加「이에요」。',
          examples:[
            {kr:'저는 웨이예요.',zh:'我是 Wei。（母音結尾）'},
            {kr:'저는 조명 디자이너예요.',zh:'我是燈光設計師。'},
          ]
        }],
        dialogue:[
          {sp:'A',kr:'어디에서 오셨어요?',zh:'您從哪裡來？'},
          {sp:'B',kr:'타이완에서 왔어요. 저는 조명 디자이너예요.',zh:'我從台灣來。我是燈光設計師。'},
          {sp:'A',kr:'와, 멋있네요!',zh:'哇，好厲害！'},
        ],
        quiz:[
          {q:'「반갑습니다」適合在什麼時候說？',opts:['道別時','初次見面','吃飯前','睡前'],ans:1},
          {q:'「디자이너」後面接？',opts:['이에요','예요','에요','이요'],ans:1},
        ]
      }
    ]
  },
  {
    id:3, kr:'음식과 교통', titles:['飲食與點餐','地點與交通'],
    topics:[
      {
        label:'① 飲食點餐',
        tip:'叫服務生：「여기요!」；外帶：「포장이요」；不辣：「안 맵게 해주세요」——這三句在首爾超實用！',
        vocab:[
          {kr:'맛있어요',rom:'ma-si-sseo-yo',zh:'好吃'},
          {kr:'맵다/달다',rom:'maep-da/dal-da',zh:'辣／甜'},
          {kr:'___ 주세요',rom:'___ju-se-yo',zh:'請給我___'},
          {kr:'얼마예요?',rom:'eol-ma-ye-yo',zh:'多少錢？'},
          {kr:'하나 더',rom:'ha-na deo',zh:'再一個'},
          {kr:'계산서',rom:'gye-san-seo',zh:'帳單'},
        ],
        grammar:[{
          pattern:'___ 주세요（萬用點餐句）',
          explain:'食物/飲料後直接加주세요。數量放名詞前，用固有語數字。',
          examples:[
            {kr:'아메리카노 두 잔 주세요.',zh:'請給我兩杯美式。'},
            {kr:'삼겹살 이 인분 주세요.',zh:'請給我兩人份五花肉。'},
          ]
        }],
        dialogue:[

const SPEAK_ICON = '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>';

let currentAudio = null;
function speak(text, btn){
  // stop any playing audio
  if(currentAudio){
    currentAudio.pause();
    currentAudio = null;
  }
  document.querySelectorAll('.speak-btn.speaking').forEach(b=>b.classList.remove('speaking'));

  // clean text — strip non-Korean chars for cleaner pronunciation
  const clean = text.replace(/[（）()／/＋+·。！？,.，、…]/g,' ').trim();
  const url = 'https://translate.google.com/translate_tts?ie=UTF-8&tl=ko&client=tw-ob&q=' + encodeURIComponent(clean);

  const audio = new Audio(url);
  audio.playbackRate = 0.9;
  currentAudio = audio;
  if(btn){
    btn.classList.add('speaking');
    audio.onended = ()=>{ btn.classList.remove('speaking'); currentAudio=null; };
    audio.onerror = ()=>{
      btn.classList.remove('speaking');
      currentAudio = null;
      // fallback to Web Speech API if Google fails
      fallbackSpeak(text, btn);
    };
  }
  audio.play().catch(()=>fallbackSpeak(text, btn));
}
function fallbackSpeak(text, btn){
  if(!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'ko-KR';
  utter.rate = 0.7;
  utter.pitch = 1.2;
  const voices = speechSynthesis.getVoices();
  const v = voices.find(v=>v.lang==='ko-KR')||voices.find(v=>v.lang.startsWith('ko'));
  if(v) utter.voice = v;
  if(btn){ btn.classList.add('speaking'); utter.onend=()=>btn.classList.remove('speaking'); }
  speechSynthesis.speak(utter);
}
function speakBtn(text){
  return `<button class="speak-btn" onclick="event.stopPropagation();speak('${text.replace(/'/g,"\'")}',this)" title="播放發音">${SPEAK_ICON}</button>`;
}

let cur=1, done=new Set(JSON.parse(localStorage.getItem('kr10d')||'[]')), qs={}, at={};

function buildSidebar(){
  const sb=document.getElementById('sidebar');
  sb.innerHTML='';
  const phases=['基礎字母','數字與介紹','飲食與移動','購物與請求','時態系統','能力與條件','情緒連接','同志場景 🏳️‍🌈','文化比較','總複習'];
  W.forEach((w,i)=>{
    const pl=document.createElement('div');
    pl.className='phase-label';
    pl.textContent=phases[i];
    sb.appendChild(pl);
    const btn=document.createElement('button');
    const isRainbow=w.rainbow&&!done.has(w.id);
    btn.className='week-btn'+(w.id===cur?' active':'')+(done.has(w.id)?' completed':'')+(isRainbow?' rainbow-week':'');

function buildWeek(w){
  qs[w.id]=qs[w.id]||{};
  if(!at[w.id])at[w.id]=0;
  let h=`<div class="week-header">
    <span class="week-num-big">WEEK ${String(w.id).padStart(2,'0')}</span>
    <div class="week-titles">
      <h1 class="week-title-big">${w.titles[0]} × ${w.titles[1]}</h1>
      <div class="week-subtitle">${w.kr}　·　兩主題合併週</div>
    </div>
    <button class="complete-btn ${done.has(w.id)?'done':''}" onclick="toggleDone(${w.id})">${done.has(w.id)?'✓ 已完成':'標記完成'}</button>
  </div>`;
  if(w.rainbow){
    h+=`<div class="rainbow-banner"><div class="rainbow-inner">
      <strong>🏳️‍🌈 首爾同志友善場景</strong>　鐘路（종로）是首爾最歷史悠久的同志聚集地，梨泰院近年也有許多 queer-friendly 空間。本週學習在這些場合自然開口的句型，涵蓋搭訕、邀約與禮貌退場。
    </div></div>`;
  }
  h+=`<div class="topic-tabs">`;
  w.topics.forEach((t,i)=>{h+=`<button class="topic-tab ${at[w.id]===i?'active':''}" onclick="switchTopic(${w.id},${i})">${t.label}</button>`;});
  h+=`</div>`;
  w.topics.forEach((t,ti)=>{
    const isA=at[w.id]===ti;
    h+=`<div class="topic-panel ${isA?'active':''}" id="tp-${w.id}-${ti}">`;
    if(t.tip)h+=`<div class="tip-box"><strong>💡　</strong>${t.tip}</div>`;
    h+=`<div class="section"><div class="section-title">詞彙　어휘</div><div class="vocab-grid">`;
    t.vocab.forEach(v=>{
      const rawKr = v.kr.replace(/[（）()／/＋+A-Za-z0-9\s·．。！？,.，、…\-]/g,'').trim()||v.kr.split('/')[0].trim();
      h+=`<div class="vocab-card">
        <div class="vocab-card-top">
          <div class="vocab-card-text" onclick="this.closest('.vocab-card').classList.toggle('revealed')">
            <span class="kr-word">${v.kr}</span>
            <span class="romanization">${v.rom}</span>
          </div>
          ${speakBtn(rawKr)}
        </div>
        <div class="meaning">${v.zh}</div>
      </div>`;
    });
    h+=`</div><p style="font-size:.68rem;color:var(--muted);margin-top:.45rem;">點擊文字顯示中文　<span style="opacity:.6">▶ 喇叭播放發音</span></p></div>`;
    h+=`<div class="section"><div class="section-title">文法　문법</div>`;
    t.grammar.forEach(g=>{
      h+=`<div class="grammar-box"><div class="grammar-pattern">${g.pattern}</div><div class="grammar-explain">${g.explain}</div><div class="grammar-example">`;
      g.examples.forEach(ex=>{
        const gKr = ex.kr.split('→')[0].replace(/[（）()A-Za-z0-9\s·,，]/g,'').trim()||ex.kr.trim();
        h+=`<div><span class="kr">${ex.kr}</span>${speakBtn(gKr)}<br><span class="zh">${ex.zh}</span></div><br>`;
      });
      h+=`</div></div>`;
    });
    h+=`</div>`;
    h+=`<div class="section"><div class="section-title">對話練習　대화</div><div class="dialogue">`;
    t.dialogue.forEach((line,i)=>{
      const sc=i%2===0?'':'b';
      h+=`<div class="dialogue-line"><div class="speaker ${sc}">${line.sp}</div><div class="dialogue-text"><div class="dialogue-kr-wrap"><span class="kr">${line.kr}</span>${speakBtn(line.kr)}</div><span class="zh">${line.zh}</span></div></div>`;
    });
    h+=`</div></div>`;
    h+=`<div class="section"><div class="section-title">小測驗　퀴즈</div><div class="quiz-wrap">`;
    t.quiz.forEach((q,qi)=>{
      const key=`${ti}-${qi}`;
      h+=`<div class="quiz-item" id="quiz-${w.id}-${key}"><div class="quiz-q">${q.q}</div><div class="quiz-options">`;
      q.opts.forEach((opt,oi)=>{
        const st=qs[w.id][key];
        const cls=st===undefined?'':(oi===q.ans?' correct':(st===oi?' wrong':''));
        h+=`<button class="quiz-opt${cls}" ${st!==undefined?'disabled':''} onclick="answer(${w.id},'${key}',${oi},${q.ans})">${opt}</button>`;
      });
      h+=`</div></div>`;
    });
    h+=`</div></div></div>`;
  });
  h+=`<div class="week-nav">
    <button class="nav-btn" onclick="go(${w.id-1})" ${w.id<=1?'disabled':''}>← 上一週</button>
    <button class="nav-btn" onclick="go(${w.id+1})" ${w.id>=10?'disabled':''}>下一週 →</button>
  </div>`;
  return h;
}
function switchTopic(wid,ti){
  at[wid]=ti;
  document.querySelectorAll(`[id^="tp-${wid}-"]`).forEach((el,i)=>el.classList.toggle('active',i===ti));
  document.querySelectorAll('.topic-tab').forEach((b,i)=>b.classList.toggle('active',i===ti));
}
function go(id){
  if(id<1||id>10)return;
  cur=id;
  const w=W.find(x=>x.id===id);
  document.getElementById('main-content').innerHTML=`<div class="week-panel active">${buildWeek(w)}</div>`;
  buildSidebar();
  window.scrollTo({top:0,behavior:'smooth'});
}
function toggleDone(id){
  done.has(id)?done.delete(id):done.add(id);

}
function answer(wid,key,sel,ans){
  qs[wid]=qs[wid]||{};
  qs[wid][key]=sel;
  document.getElementById(`quiz-${wid}-${key}`).querySelectorAll('.quiz-opt').forEach((b,i)=>{
    b.disabled=true;
    if(i===ans)b.classList.add('correct');
    else if(i===sel)b.classList.add('wrong');
  });
}
updateBar();go(1);
</script>
